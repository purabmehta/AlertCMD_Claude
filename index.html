  --accent: 220 14% 92%;h

.trade-btn.active { background: var(--open-trades-bg); color: var(--open-trades-text); border-color: var(--open-trades-border); }

.form-input:focus { border-color: hsl(var(--primary)); }
select.form-input { cursor: pointer; }
/* Settings */
.settings-section { background: hsl(var(--card)); border: 1px solid hsl(var(--border)); border-radius: 8px; padding: 16px; margin-bottom: 14px; }
.settings-section h3 { font-size: 0.88rem; font-weight: 700; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid hsl(var(--border)); color: hsl(var(--muted-foreground)); text-transform: uppercase; letter-spacing: 0.06em; }
.settings-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid hsl(var(--border) / 0.5); gap: 12px; }
.settings-row:last-child { border-bottom: none; padding-bottom: 0; }
.settings-label { font-size: 0.85rem; font-weight: 500; }

/* Toggle */
.toggle { position: relative; width: 36px; height: 20px; flex-shrink: 0; }

.toggle input:checked + .toggle-slider { background: hsl(var(--primary)); }
.toggle input:checked + .toggle-slider:before { transform: translateX(16px); }
/* Watchlist */
.watchlist-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.watchlist-chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; background: hsl(var(--card)); border: 1px solid hsl(var(--border)); border-radius: 6px; font-size: 0.8rem; font-weight: 600; font-family: 'JetBrains Mono', monospace; transition: all 0.1s; }

.color-grid { display: flex; flex-wrap: wrap; gap: 4px; }
.color-swatch { width: 22px; height: 22px; border-radius: 4px; cursor: pointer; border: 2px solid transparent; transition: all 0.1s; }
.color-swatch:hover, .color-swatch.active { border-color: white; transform: scale(1.15); }

.screener-stats { display: flex; gap: 16px; font-size: 0.75rem; color: hsl(var(--muted-foreground)); margin-bottom: 10px; flex-wrap: wrap; }

<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useMemo, useRef, createContext, useContext } = React;

// ============================================================
// CONSTANTS
// ============================================================
const API_BASE = 'https://alertcmd.purabmehta.workers.dev';
const SCREENER_BASE = 'https://screener.purabmehta.workers.dev';
const POLL_INTERVAL = 30000;  // 10 seconds - matches original app
const SCREENER_POLL_INTERVAL = 30000;  // 30 seconds - matches original app

const BOARD_COLUMNS = [
  { id: 'bullish', label: 'Bullish', colorKey: 'bullish' },
  { id: 'bearish', label: 'Bearish', colorKey: 'bearish' },
  { id: 'sell_calls', label: 'Sell Calls', colorKey: 'sell' },
  { id: 'open_trades', label: 'Open Trades', colorKey: 'opentrades' },
];

const SCREENER_MODES = [
  { id: 'bullish_entry', label: 'Bullish Trade Entry' },
  { id: 'bearish_entry', label: 'Bearish Trade Entry' },
  { id: 'already_bullish', label: 'Already Bullish' },
  { id: 'already_bearish', label: 'Already Bearish' },
  { id: 'exit_long', label: 'Exit Long' },
  { id: 'exit_short', label: 'Exit Short' },
  { id: 'long_aggressive', label: 'Long Aggressive' },
  { id: 'short_aggressive', label: 'Short Aggressive' },
  { id: 'all', label: 'All / Debug' },
];

// ============================================================
// TRADING STORE (core data management with real API polling)
// ============================================================
function useTradingStore() {
  const [alerts, setAlerts] = useState([]);
  const [watchlist, setWatchlist] = useState([]);
  const [openTrades, setOpenTrades] = useState([]);
  const [openTradesIds, setOpenTradesIds] = useState({}); // symbol -> KV id, for DELETE
  const [rules, setRules] = useState([]);
  const [searchQuery, setSearchQuery] = useState('');
  const [assetFilter, setAssetFilter] = useState('all');
  const [lastUpdated, setLastUpdated] = useState(null);
  const [isLive, setIsLive] = useState(false);

  const fetchBootstrap = useCallback(async () => {
    try {
      const res = await fetch(API_BASE);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (data.alerts) setAlerts(data.alerts);
      if (data.watchlist) setWatchlist(Array.isArray(data.watchlist) ? data.watchlist.map(w => typeof w === 'string' ? w : w.symbol) : []);
      if (data.openTrades) {
        const arr = Array.isArray(data.openTrades) ? data.openTrades : [data.openTrades].filter(Boolean);
        setOpenTrades(arr.map(t => typeof t === 'string' ? t : t.symbol));
        const ids = {};
        arr.forEach(t => { if (t && typeof t !== 'string' && t.id) ids[t.symbol] = t.id; });
        setOpenTradesIds(ids);
      }
      if (data.rules) setRules(data.rules);
      setLastUpdated(new Date());
      setIsLive(true);
    } catch(e) {
      setIsLive(false);
    }
  }, []);

  useEffect(() => {
    fetchBootstrap();
    const id = setInterval(fetchBootstrap, POLL_INTERVAL);
    return () => clearInterval(id);
  }, [fetchBootstrap]);

  const deleteAlert = useCallback(async (id) => {
    setAlerts(prev => prev.filter(a => a.id !== id));
  }, []);

  const addToWatchlist = useCallback(async (symbol) => {
    const sym = symbol.toUpperCase().trim();
    if (!sym || watchlist.includes(sym)) return;
    setWatchlist(prev => [...prev, sym].sort());
    try {
      await fetch(API_BASE + '/api/watchlist', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({symbol: sym}) });
    } catch(e) {}
  }, [watchlist]);

  const removeFromWatchlist = useCallback(async (symbol) => {
    setWatchlist(prev => prev.filter(s => s !== symbol));
    try { await fetch(API_BASE + '/api/watchlist/' + symbol, { method: 'DELETE' }); } catch(e) {}
  }, []);

  const addOpenTrade = useCallback(async (symbol) => {
    if (openTrades.includes(symbol)) return;
    setOpenTrades(prev => [...prev, symbol]);
    const latestAlert = alerts.find(a => a.symbol === symbol);
    try {
      const body = { symbol, strategy: latestAlert?.strategy || '', direction: latestAlert?.direction || '', price: latestAlert?.price || null };
      const res = await fetch(API_BASE + '/api/open-trades', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
      if (res.ok) {
        const json = await res.json();
        if (json.trade?.id) setOpenTradesIds(prev => ({ ...prev, [symbol]: json.trade.id }));
      }
    } catch(e) {}
  }, [openTrades, alerts]);

  const removeOpenTrade = useCallback(async (symbol) => {
    setOpenTrades(prev => prev.filter(s => s !== symbol));
    const tradeId = openTradesIds[symbol];
    setOpenTradesIds(prev => { const n = {...prev}; delete n[symbol]; return n; });
    if (tradeId) {
      try { await fetch(API_BASE + '/api/open-trades/' + tradeId, { method: 'DELETE' }); } catch(e) {}
    }
  }, [openTradesIds]);

  const addRule = useCallback(async (rule) => {
    try {
      const res = await fetch(API_BASE + '/api/rules', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(rule) });
      if (res.ok) {
        const newRule = await res.json();
        setRules(prev => [...prev, newRule]);
      } else {
        setRules(prev => [...prev, { ...rule, id: Date.now(), priority: prev.length + 1 }]);
      }
    } catch(e) {
      setRules(prev => [...prev, { ...rule, id: Date.now(), priority: prev.length + 1 }]);
    }
  }, []);

  const deleteRule = useCallback(async (id) => {
    setRules(prev => prev.filter(r => r.id !== id));
    try { await fetch(API_BASE + '/api/rules/' + id, { method: 'DELETE' }); } catch(e) {}
  }, []);

  const toggleFavorite = useCallback((alertId) => {
    setAlerts(prev => prev.map(a => a.id === alertId ? {...a, isFavorite: !a.isFavorite} : a));
  }, []);

  const toggleOpenTrade = useCallback((symbol) => {
    if (openTrades.includes(symbol)) removeOpenTrade(symbol);
    else addOpenTrade(symbol);
  }, [openTrades, addOpenTrade, removeOpenTrade]);

  return {
    alerts, watchlist, openTrades, rules, searchQuery, setSearchQuery,
    assetFilter, setAssetFilter, lastUpdated, isLive,
    deleteAlert, toggleFavorite, toggleOpenTrade,
    addToWatchlist, removeFromWatchlist, addRule, deleteRule,
  };
}

// ============================================================
// ROUTING LOGIC (matches original AlertsBoard routing)
// ============================================================
function routeColumn(alert, rules) {
  // User-defined rules take priority
  const sortedRules = [...rules].sort((a, b) => (a.priority || 999) - (b.priority || 999));
  for (const rule of sortedRules) {
    const fieldVal = (alert[rule.match_field] || alert[rule.match_field?.replace('_', '')] || '').toLowerCase();
    if (fieldVal.includes((rule.match_contains || '').toLowerCase())) {
      return rule.column_name;
    }
  }
  // Built-in routing rules engine (case-insensitive, per spec)
  const strat = (alert.strategy || '').toLowerCase();
  const dir = (alert.direction || '').toLowerCase();
  if (strat.includes('sell calls')) return 'sell_calls';
  if (strat.includes('sell the rip')) return 'bearish';
  if (dir.includes('short') || dir.includes('sell')) return 'bearish';
  if (dir.includes('long') || dir.includes('buy')) return 'bullish';
  return 'bullish';
}

// ============================================================
// HELPERS
// ============================================================
function isToday(dateStr) {
  if (!dateStr) return false;
  const d = new Date(dateStr);
  const now = new Date();
  return d.toDateString() === now.toDateString();
}
function fmtTime(dateStr) {
  if (!dateStr) return '';
  return new Date(dateStr).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}
function fmtDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  return d.toLocaleDateString([], {month:'short', day:'numeric'}) + ' ' + d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}
function timeAgo(dateStr) {
  if (!dateStr) return '';
  const diff = Date.now() - new Date(dateStr).getTime();
  const m = Math.floor(diff / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + 'm ago';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h ago';
  return Math.floor(h / 24) + 'd ago';
}
function fmtVol(n) {
  if (!n) return '-';
  if (n >= 1e9) return '$' + (n/1e9).toFixed(2) + 'B';
  if (n >= 1e6) return '$' + (n/1e6).toFixed(0) + 'M';
  if (n >= 1e3) return '$' + (n/1e3).toFixed(0) + 'K';
  return '$' + n.toLocaleString();
}
function fmtPrice(p) {
  if (p == null) return '-';
  if (p < 0.001) return p.toFixed(6);
  if (p < 1) return p.toFixed(4);
  if (p < 100) return p.toFixed(2);
  return p.toLocaleString(undefined, {maximumFractionDigits: 2});
}
function applyScreenerFilter(rows, mode) {
  switch(mode) {
    case 'bullish_entry': return rows.filter(r => r.weeklyRegime === 'BULLISH' && r.trigger12h === 'BULLISH_CROSS');
    case 'bearish_entry': return rows.filter(r => r.weeklyRegime === 'BEARISH' && r.trigger12h === 'BEARISH_CROSS');
    case 'already_bullish': return rows.filter(r => r.weeklyRegime === 'BULLISH' && (r.trigger12h === 'BULLISH' || r.trigger12h === 'BULLISH_CROSS'));
    case 'already_bearish': return rows.filter(r => r.weeklyRegime === 'BEARISH' && (r.trigger12h === 'BEARISH' || r.trigger12h === 'BEARISH_CROSS'));
    case 'exit_long': return rows.filter(r => r.stochRsi12hCross === 'cross_down' && (r.trigger12h === 'BULLISH' || r.trigger12h === 'BULLISH_CROSS'));
    case 'exit_short': return rows.filter(r => r.stochRsi12hCross === 'cross_up' && (r.trigger12h === 'BEARISH' || r.trigger12h === 'BEARISH_CROSS'));
    case 'long_aggressive': return rows.filter(r => (r.trigger12h === 'BULLISH' || r.trigger12h === 'BULLISH_CROSS') && r.stochRsi12hCross === 'cross_up');
    case 'short_aggressive': return rows.filter(r => (r.trigger12h === 'BEARISH' || r.trigger12h === 'BEARISH_CROSS') && r.stochRsi12hCross === 'cross_down');
    default: return rows;
  }
}

                        color: isOpen ? '#16a34a' : 'hsl(var(--muted-foreground))',
                      }}
                      onClick={() => toggleOpenTrade(alert.symbol)}
                    >
                      {isOpen ? 'OPEN' : '—'}
                    </button>
                  </td>
                  <td>
                    <button className={'icon-btn' + (isFav ? ' active' : '')} onClick={() => toggleFavorite(alert.id)}>
                      <I.Star filled={isFav} s={13}/>
                    </button>
                  </td>
                  <td>
                    <button className="icon-btn danger" onClick={() => deleteAlert(alert.id)}>
                      <I.Trash/>
                    </button>
                  </td>
                </tr>
              );
            })}
            {filtered.length === 0 && (
              <tr><td colSpan="9" style={{textAlign:'center',padding:'32px',color:'hsl(var(--muted-foreground))'}}>No alerts match the current filters</td></tr>
            )}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ============================================================
// DIRECTION BOARD (AlertsBoard)
// ============================================================
function DirectionBoard() {
  const { alerts, rules, openTrades, watchlist, toggleFavorite, deleteAlert, toggleOpenTrade, searchQuery, assetFilter } = useTrading();
  const [todayOnly, setTodayOnly] = useState(false);
  const [openTradeOnly, setOpenTradeOnly] = useState(false);
  const [dedupeMode, setDedupeMode] = useState(true);
  const [watchFilter, setWatchFilter] = useState(null);
  const [addOpenSym, setAddOpenSym] = useState('');

  const STRAT_COLOR = { bullish: '#16a34a', bearish: '#dc2626', sell_calls: '#d97706', open_trades: '#16a34a' };

  const columns = useMemo(() => {
    let list = [...alerts];
    if (assetFilter === 'stocks') list = list.filter(a => (a.assetClass||a.asset_class) === 'stock');
    else if (assetFilter === 'crypto') list = list.filter(a => (a.assetClass||a.asset_class) === 'crypto');
    if (searchQuery) { const q = searchQuery.toLowerCase(); list = list.filter(a => (a.symbol||'').toLowerCase().includes(q)); }
    if (todayOnly) list = list.filter(a => isToday(a.createdAt || a.created_at));
    if (openTradeOnly) list = list.filter(a => openTrades.includes(a.symbol));
    if (watchFilter) list = list.filter(a => a.symbol === watchFilter);

    // Sort newest-first so first occurrence in dedupe is the most recent
    list.sort((a, b) => {
      const at = a.createdAt||a.created_at||'', bt = b.createdAt||b.created_at||'';
      return bt > at ? 1 : -1;
    });

    const cols = { bullish: [], bearish: [], sell_calls: [] };
    const seen = {};

    for (const alert of list) {
      const col = routeColumn(alert, rules);
      if (!cols[col]) cols[col] = [];
      const key = col + ':' + alert.symbol;
      if (dedupeMode) {
        if (!seen[key]) {
          seen[key] = { ...alert, _count: 1 };
          cols[col].push(seen[key]);
        } else {
          seen[key]._count++;
        }
      } else {
        cols[col].push({ ...alert, _count: 1 });
      }
    }

    // Open Trades column — one card per open trade symbol with last-alert data
    const openTradeCards = openTrades.map(sym => {
      const lastAlert = [...alerts].filter(a => a.symbol === sym).sort((a, b) => {
        const at = a.createdAt||a.created_at||'', bt = b.createdAt||b.created_at||'';
        return bt > at ? 1 : -1;
      })[0];
      return {
        id: 'ot_' + sym, symbol: sym,
        createdAt: lastAlert?.createdAt || lastAlert?.created_at || new Date().toISOString(),
        strategy: lastAlert?.strategy || '',
        _isOpenTrade: true, _count: 1,
      };
    });

    return { ...cols, open_trades: openTradeCards };
  }, [alerts, rules, openTrades, assetFilter, searchQuery, todayOnly, openTradeOnly, dedupeMode, watchFilter]);

  function SymCard({ alert, colId }) {
    const isFav = alert.isFavorite;
    const isOpen = openTrades.includes(alert.symbol);
    const ts = alert.createdAt || alert.created_at;
    const stratText = alert.strategy || '';
    return (
      <div className="sym-card">
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:'flex',alignItems:'center',gap:5}}>
            <span className="sym-card-name">{alert.symbol}</span>
            {alert._count > 1 && (
              <span style={{background:'#d97706',color:'white',borderRadius:10,fontSize:'0.62rem',fontWeight:800,padding:'1px 5px'}}>
                x{alert._count}
              </span>
            )}
            {isOpen && !alert._isOpenTrade && (
              <span className="badge badge-open" style={{fontSize:'0.58rem',padding:'1px 5px'}}>OPEN</span>
            )}
          </div>
          <div className="sym-card-sub" style={{display:'flex',alignItems:'center',gap:'5px',flexWrap:'wrap'}}>
            {stratText && (<span style={{background: STRAT_COLOR[colId] ? STRAT_COLOR[colId] + '22' : 'hsl(var(--secondary))', color: STRAT_COLOR[colId] || 'hsl(var(--muted-foreground))', border: '1px solid ' + (STRAT_COLOR[colId] || 'hsl(var(--border))'), borderRadius:4, fontSize:'0.65rem', fontWeight:700, padding:'1px 6px', letterSpacing:'0.03em'}}>{stratText}</span>)}
            <span style={{color:'hsl(var(--muted-foreground))',fontSize:'0.7rem'}}>{timeAgo(ts)}</span>
          </div>
        </div>
        <div className="sym-card-actions">
          {alert._isOpenTrade ? (
            <button className="icon-btn danger" title="Remove from open trades" onClick={() => toggleOpenTrade(alert.symbol)}>
              <I.X s={12}/>
            </button>
          ) : (
            <>
              <button className={'icon-btn' + (isOpen ? ' active' : '')} title={isOpen ? 'Remove from open trades' : 'Mark as open trade'} onClick={() => toggleOpenTrade(alert.symbol)}>
                <I.Bookmark s={12}/>
              </button>
              <button className={'icon-btn' + (isFav ? ' active' : '')} onClick={() => toggleFavorite(alert.id)}>
                <I.Star filled={isFav} s={12}/>
              </button>
              <button className="icon-btn" onClick={() => window.open('https://www.tradingview.com/chart/?symbol=' + alert.symbol, '_blank')}>
                <I.Link s={12}/>
              </button>
              <button className="icon-btn danger" onClick={() => deleteAlert(alert.id)}>
                <I.Trash s={12}/>
              </button>
            </>
          )}
        </div>
      </div>
    );
  }

  const colDefs = [
    { id: 'bullish', label: 'Bullish', cls: 'bullish' },
    { id: 'bearish', label: 'Bearish', cls: 'bearish' },
    { id: 'sell_calls', label: 'Sell Calls', cls: 'sell' },
    { id: 'open_trades', label: 'Open Trades', cls: 'opentrades' },
  ];

  function handleAddOpenTrade(e) {
    if (e.key === 'Enter') {
      const sym = addOpenSym.trim().toUpperCase();
      if (sym) { toggleOpenTrade(sym); setAddOpenSym(''); }
    }
  }

  return (
    <div className="page">
      {watchlist.length > 0 && (
        <div style={{display:'flex',gap:5,overflowX:'auto',paddingBottom:8,marginBottom:8,flexWrap:'nowrap',borderBottom:'1px solid hsl(var(--border))'}}>
          {watchFilter && (
            <button className="filter-chip active" style={{whiteSpace:'nowrap',flexShrink:0}} onClick={() => setWatchFilter(null)}>
              × {watchFilter}
            </button>
          )}
          {watchlist.slice(0,50).map(sym => (
            <button key={sym} className={'filter-chip' + (watchFilter === sym ? ' active' : '')}
              style={{fontSize:'0.7rem',padding:'3px 8px',whiteSpace:'nowrap',flexShrink:0,fontFamily:'JetBrains Mono,monospace'}}
              onClick={() => setWatchFilter(watchFilter === sym ? null : sym)}>
              {sym}
            </button>
          ))}
        </div>
      )}
      <div className="page-header">
        <span className="page-title">Direction Board</span>
        <span className="count-badge">Bullish {columns.bullish?.length || 0} - Bearish {columns.bearish?.length || 0} - Sell Calls {columns.sell_calls?.length || 0} - Open {columns.open_trades?.length || 0}</span>
      </div>
      <div className="filter-bar">
        <button className={'filter-chip' + (todayOnly ? ' active' : '')} onClick={() => setTodayOnly(t => !t)}>Today</button>
        <button className={'filter-chip' + (openTradeOnly ? ' active' : '')} onClick={() => setOpenTradeOnly(t => !t)}>Open Trades Only</button>
        <button
          className="filter-chip"
          style={dedupeMode ? {background:'#d97706',color:'white',borderColor:'#d97706'} : {}}
          onClick={() => setDedupeMode(d => !d)}
        >{dedupeMode ? 'Dedupe: ON' : 'Show All'}</button>
      </div>
      <div className="kanban">
        {colDefs.map(({ id, label, cls }) => (
          <div key={id} className="kanban-col">
            <div className={'kanban-header ' + cls} style={{alignItems:'center'}}>
              {id === 'open_trades' ? (
                <>
                  <span style={{flex:1}}>● {label} {columns[id]?.length || 0}</span>
                  <input
                    placeholder="Add symbol..."
                    value={addOpenSym}
                    onChange={e => setAddOpenSym(e.target.value.toUpperCase())}
                    onKeyDown={handleAddOpenTrade}
                    style={{
                      background:'transparent',border:'1px solid currentColor',borderRadius:4,
                      padding:'2px 6px',fontSize:'0.68rem',color:'inherit',outline:'none',
                      width:100,opacity:0.85,fontFamily:'JetBrains Mono,monospace',
                    }}
                  />
                </>
              ) : (
                <span>● {label} {columns[id]?.length || 0}</span>
              )}
            </div>
            <div className="kanban-body">
              {(columns[id] || []).map(alert => <SymCard key={alert.id} alert={alert} colId={id}/>)}
              {(!columns[id] || columns[id].length === 0) && (
                <div style={{color:'hsl(var(--muted-foreground))',fontSize:'0.75rem',textAlign:'center',padding:'24px 0'}}>
                  {id === 'open_trades' ? 'No open trades' : 'No alerts'}
                </div>
              )}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ============================================================
// STRATEGY BOARD
// ============================================================
function StrategyBoard() {
  const { alerts, rules, openTrades, searchQuery, assetFilter } = useTrading();
  const [todayOnly, setTodayOnly] = React.useState(false);
  const [openTradeOnly, setOpenTradeOnly] = React.useState(false);
  const [dedupeMode, setDedupeMode] = React.useState(false);
  const [signalFilter, setSignalFilter] = React.useState('all');

  const COL_CLASS = { bullish: 'bullish', bearish: 'bearish', sell_calls: 'sell' };
  const todayStr = new Date().toISOString().slice(0, 10);

  const strategies = useMemo(() => {
    let list = [...alerts];
    if (assetFilter === 'stocks') list = list.filter(a => (a.assetClass||a.asset_class) === 'stock');
    else if (assetFilter === 'crypto') list = list.filter(a => (a.assetClass||a.asset_class) === 'crypto');
    if (searchQuery) { const q = searchQuery.toLowerCase(); list = list.filter(a => (a.symbol||'').toLowerCase().includes(q)); }
    if (todayOnly) list = list.filter(a => (a.createdAt||a.created_at||'').startsWith(todayStr));
    if (openTradeOnly) list = list.filter(a => openTrades.includes(a.symbol));
    if (signalFilter !== 'all') list = list.filter(a => routeColumn(a, rules) === signalFilter);
    const map = {};
    for (const alert of list) {
      const s = alert.strategy || 'Uncategorized';
      if (!map[s]) map[s] = [];
      map[s].push(alert);
    }
    return map;
  }, [alerts, assetFilter, searchQuery, todayOnly, openTradeOnly, signalFilter, openTrades, rules, todayStr]);

  const stratKeys = Object.keys(strategies).sort();
  const totalAlerts = stratKeys.reduce((n, s) => n + strategies[s].length, 0);

  function getStratRoute(stratName) {
    const sample = strategies[stratName]?.[0];
    return sample ? routeColumn(sample, rules) : 'bullish';
  }

  function getDeduped(cards) {
    if (!dedupeMode) return cards.map(a => ({ ...a, _count: 1 }));
    const sorted = [...cards].sort((a, b) => {
      const at = a.createdAt||a.created_at||'', bt = b.createdAt||b.created_at||'';
      return bt > at ? 1 : -1;
    });
    const seen = {};
    const result = [];
    for (const alert of sorted) {
      if (!seen[alert.symbol]) { seen[alert.symbol] = { ...alert, _count: 1 }; result.push(seen[alert.symbol]); }
      else { seen[alert.symbol]._count++; }
    }
    return result;
  }

  return (
    <div className="page">
      <div className="page-header">
        <span className="page-title">Strategy Board</span>
        <span className="count-badge">{stratKeys.length} strategies - {totalAlerts} alerts</span>
      </div>
      <div className="filter-bar">
        <button className={'filter-chip' + (todayOnly ? ' active' : '')} onClick={() => setTodayOnly(v => !v)}>Today</button>
        <button className={'filter-chip' + (openTradeOnly ? ' active' : '')} onClick={() => setOpenTradeOnly(v => !v)}>Open Trades Only</button>
        <button className={'filter-chip' + (dedupeMode ? ' active' : '')} style={dedupeMode ? {background:'#d97706',color:'white',borderColor:'#d97706'} : {}} onClick={() => setDedupeMode(v => !v)}>Dedupe</button>
        <div style={{marginLeft:'auto',display:'flex',gap:5,flexWrap:'wrap'}}>
          {[['all','All Signals'],['bullish','Bullish'],['bearish','Bearish'],['sell_calls','Sell Calls']].map(([id,label]) => (
            <button key={id} className={'filter-chip' + (signalFilter === id ? ' active' : '')} onClick={() => setSignalFilter(id)}>{label}</button>
          ))}
        </div>
      </div>
      <div className="kanban">
        {stratKeys.map(strat => {
          const route = getStratRoute(strat);
          const cls = COL_CLASS[route] || 'strategy';
          const cards = getDeduped(strategies[strat]);
          return (
            <div key={strat} className="kanban-col">
              <div className={'kanban-header ' + cls}>
                <span style={{fontSize:'0.75rem',flex:1}}>{strat}</span>
                <span style={{fontSize:'0.82rem'}}>{cards.length}</span>
              </div>
              <div className="kanban-body">
                {cards.map(alert => (
                  <div key={alert.id} className="sym-card" style={{cursor:'pointer'}} onClick={() => window.open('https://www.tradingview.com/chart/?symbol=' + alert.symbol, '_blank')}>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{display:'flex',alignItems:'center',gap:5}}>
                        <span className="sym-card-name">{alert.symbol}</span>
                        {alert._count > 1 && <span style={{background:'#d97706',color:'white',borderRadius:10,fontSize:'0.62rem',fontWeight:800,padding:'1px 5px'}}>x{alert._count}</span>}
                        {openTrades.includes(alert.symbol) && <span className="badge badge-open" style={{fontSize:'0.58rem',padding:'1px 5px'}}>OPEN</span>}
                      </div>
                      <div className="sym-card-sub">{timeAgo(alert.createdAt || alert.created_at)}</div>
                    </div>
                    <I.Link s={11}/>
                  </div>
                ))}
              </div>
            </div>
          );
        })}
        {stratKeys.length === 0 && (
          <div style={{padding:'32px',color:'hsl(var(--muted-foreground))'}}>No alerts loaded yet</div>
        )}
      </div>
    </div>
  );
}

// ============================================================
// CRYPTO SCREENER
// ============================================================
function CryptoScreener() {
  const { watchlist, addToWatchlist, removeFromWatchlist } = useTrading();
  const [mode, setMode] = useState('bullish_entry');
  const [rowsRaw, setRowsRaw] = useState([]);
  const [loading, setLoading] = useState(false);
  const [refreshing, setRefreshing] = useState(false);
  const [engineUpdatedAt, setEngineUpdatedAt] = useState(null);
  const [totalPairs, setTotalPairs] = useState(0);
  const [scannedPairs, setScannedPairs] = useState(0);
  const [sortKey, setSortKey] = useState('quoteVolume');
  const [sortDir, setSortDir] = useState('desc');
  const [onlyFavorites, setOnlyFavorites] = useState(false);
  const [minVolM, setMinVolM] = useState(1);

  async function fetchScreener(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    setRowsRaw(data.results || []);
    if (data.updatedAt) setEngineUpdatedAt(data.updatedAt);
    if (data.totalPairs) setTotalPairs(data.totalPairs);
    if (data.scannedPairs) setScannedPairs(data.scannedPairs);
  }

  const loadScreener = useCallback(async () => {
    setLoading(true);
    try { await fetchScreener(SCREENER_BASE + '?minVol=' + (minVolM * 1e6)); } catch(e) {}
    setLoading(false);
  }, [minVolM]);

  async function forceRefresh() {
    setRefreshing(true);
    try { await fetchScreener(SCREENER_BASE + '?refresh=true&minVol=' + (minVolM * 1e6)); } catch(e) {}
    setRefreshing(false);
  }

  useEffect(() => {
    loadScreener();
    const id = setInterval(loadScreener, SCREENER_POLL_INTERVAL);
    return () => clearInterval(id);
  }, [loadScreener]);

  const rows = useMemo(() => {
    let list = applyScreenerFilter(rowsRaw, mode);
    if (onlyFavorites) list = list.filter(r => watchlist.includes(r.symbol));
    if (minVolM > 0) list = list.filter(r => (r.quoteVolume || 0) >= minVolM * 1e6);
    list = [...list].sort((a, b) => {
      const av = a[sortKey] ?? '', bv = b[sortKey] ?? '';
      return sortDir === 'asc' ? (av > bv ? 1 : -1) : (av < bv ? 1 : -1);
    });
    return list;
  }, [rowsRaw, mode, sortKey, sortDir, onlyFavorites, watchlist, minVolM]);

  function onSort(key) {
    if (sortKey === key) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
    else { setSortKey(key); setSortDir('desc'); }
  }
  function sm(k) { return sortKey === k ? (sortDir === 'asc' ? ' (asc)' : ' (desc)') : ''; }

  function TriggerCell({ val }) {
    if (!val) return <span style={{color:'hsl(var(--muted-foreground))'}}>-</span>;
    const isCross = val.includes('CROSS');
    const isBull = val.includes('BULLISH');
    const color = isBull ? (isCross ? '#16a34a' : '#4ade80') : (isCross ? '#dc2626' : '#f87171');
    const label = val.replace('_CROSS', ' CROSS').replace('_', ' ');
    return <span style={{color, fontWeight: isCross ? 700 : 500, fontSize:'0.75rem'}}>{label}</span>;
  }

  function StochCell({ row }) {
    const k = row.stochK, d = row.stochD, cross = row.stochRsi12hCross;
    const arrow = cross === 'cross_up'
      ? <span style={{color:'#16a34a',fontWeight:700}}> UP</span>
      : cross === 'cross_down'
      ? <span style={{color:'#dc2626',fontWeight:700}}> DN</span>
      : null;
    if (k == null) return <span style={{color:'hsl(var(--muted-foreground))'}}>-</span>;
    return <span style={{fontSize:'0.73rem',fontFamily:'JetBrains Mono,monospace'}}>
      {k.toFixed(1)}/{d != null ? d.toFixed(1) : '-'}{arrow}
    </span>;
  }

  return (
    <div className="page">
      <div className="page-header" style={{justifyContent:'space-between'}}>
        <span className="page-title">Crypto Screener</span>
        <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
          {engineUpdatedAt && (
            <span style={{fontSize:'0.75rem',color:'hsl(var(--muted-foreground))'}}>
              {scannedPairs > 0 && <span>{scannedPairs}/{totalPairs} pairs - </span>}
              updated {timeAgo(engineUpdatedAt)}
            </span>
          )}
          <label className="toggle"><input type="checkbox" checked={onlyFavorites} onChange={e => setOnlyFavorites(e.target.checked)}/><span className="toggle-slider"/></label>
          <span style={{fontSize:'0.78rem'}}>Favs only</span>
          <span style={{fontSize:'0.78rem',color:'hsl(var(--muted-foreground))'}}>Min vol $</span>
          <input type="number" className="form-input" style={{width:70,padding:'3px 6px',fontSize:'0.78rem'}} value={minVolM}
            onChange={e => setMinVolM(Number(e.target.value) || 0)} placeholder="50"/>
          <span style={{fontSize:'0.75rem',color:'hsl(var(--muted-foreground))'}}>M</span>
          <button className="btn btn-primary" onClick={forceRefresh} disabled={refreshing || loading}
            style={{display:'flex',gap:5,alignItems:'center',minWidth:120}}>
            <I.RefreshCw s={12}/>{refreshing ? 'Scanning... (30-60s)' : loading ? 'Loading...' : 'Force Refresh'}
          </button>
        </div>
      </div>
      <div className="screener-tabs">
        {SCREENER_MODES.map(m => (
          <button key={m.id} className={'screener-tab' + (mode === m.id ? ' active' : '')} onClick={() => setMode(m.id)}>
            {m.label}{mode === m.id ? ' (' + rows.length + ')' : ''}
          </button>
        ))}
      </div>
      <div className="table-wrap">
        <table>
          <thead>
            <tr>
              <th style={{width:36}}></th>
              <th className="sortable" onClick={() => onSort('symbol')}>Symbol{sm('symbol')}</th>
              <th className="sortable" onClick={() => onSort('lastPrice')} style={{textAlign:'right'}}>Price{sm('lastPrice')}</th>
              <th className="sortable" onClick={() => onSort('priceChangePercent')} style={{textAlign:'right'}}>24h%{sm('priceChangePercent')}</th>
              <th className="sortable" onClick={() => onSort('quoteVolume')} style={{textAlign:'right'}}>24h Vol{sm('quoteVolume')}</th>
              <th>Weekly</th>
              <th>12H MACD</th>
              <th>Stoch RSI</th>
              <th style={{textAlign:'right'}}>Updated</th>
            </tr>
          </thead>
          <tbody>
            {rows.map(r => {
              const isFav = watchlist.includes(r.symbol);
              const pct = parseFloat(r.priceChangePercent);
              return (
                <tr key={r.symbol} style={{cursor:'pointer'}} onClick={() => window.open('https://www.tradingview.com/chart/?symbol=BINANCE:' + r.symbol, '_blank')}>
                  <td onClick={e => e.stopPropagation()}>
                    <button className={'icon-btn' + (isFav ? ' active' : '')} onClick={() => isFav ? removeFromWatchlist(r.symbol) : addToWatchlist(r.symbol)}>
                      <I.Star filled={isFav} s={13}/>
                    </button>
                  </td>
                  <td><span className="mono" style={{fontWeight:700}}>{r.symbol}</span></td>
                  <td className="mono" style={{textAlign:'right'}}>{fmtPrice(r.lastPrice)}</td>
                  <td className="mono" style={{textAlign:'right',color: pct >= 0 ? '#16a34a' : '#dc2626', fontWeight:600}}>
                    {!isNaN(pct) ? (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%' : '-'}
                  </td>
                  <td className="mono" style={{textAlign:'right'}}>{fmtVol(r.quoteVolume)}</td>
                  <td>
                    <span style={{
                      padding:'2px 7px', borderRadius:4, fontSize:'0.72rem', fontWeight:700,
                      background: r.weeklyRegime === 'BULLISH' ? 'var(--bullish-bg)' : 'var(--bearish-bg)',
                      color: r.weeklyRegime === 'BULLISH' ? 'var(--bullish-text)' : 'var(--bearish-text)',
                      border: '1px solid ' + (r.weeklyRegime === 'BULLISH' ? 'var(--bullish-border)' : 'var(--bearish-border)')
                    }}>
                      {r.weeklyRegime || '-'}
                    </span>
                  </td>
                  <td><TriggerCell val={r.trigger12h}/></td>
                  <td><StochCell row={r}/></td>
                  <td style={{textAlign:'right',fontSize:'0.7rem',color:'hsl(var(--muted-foreground))'}}>{timeAgo(r.updatedAt)}</td>
                </tr>
              );
            })}
            {rows.length === 0 && (
              <tr><td colSpan="9" style={{textAlign:'center',padding:'32px',color:'hsl(var(--muted-foreground))'}}>
                {loading || refreshing ? 'Loading screener data...' : rowsRaw.length === 0 ? 'No data - click Force Refresh or wait for auto-load' : 'No results for this filter'}
              </td></tr>
            )}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ============================================================
// WATCHLISTS
// ============================================================
function Watchlists() {
  const { watchlist, openTrades, addToWatchlist, removeFromWatchlist, toggleOpenTrade } = useTrading();
  const [newSym, setNewSym] = useState('');
  const [newOpenSym, setNewOpenSym] = useState('');

  function handleAdd() {
    const sym = newSym.trim().toUpperCase();
    if (sym) { addToWatchlist(sym); setNewSym(''); }
  }

  function handleAddOpen() {
    const sym = newOpenSym.trim().toUpperCase();
    if (sym) { toggleOpenTrade(sym); setNewOpenSym(''); }
  }

  return (
    <div className="page">
      <div className="page-header">
        <span className="page-title">Watchlists</span>
        <span className="count-badge">{watchlist.length} watched - {openTrades.length} open</span>
      </div>
      <div className="form-card" style={{marginBottom:16}}>
        <div style={{fontWeight:600,fontSize:'0.85rem',marginBottom:12,color:'var(--open-trades-text,#16a34a)'}}>OPEN TRADES</div>
        <div style={{display:'flex',gap:8,marginBottom:12}}>
          <input className="form-input" style={{maxWidth:240}} placeholder="Add open trade symbol..."
            value={newOpenSym} onChange={e => setNewOpenSym(e.target.value.toUpperCase())}
            onKeyDown={e => e.key === 'Enter' && handleAddOpen()} />
          <button className="btn btn-primary" onClick={handleAddOpen} style={{display:'flex',gap:5,alignItems:'center'}}>
            <I.Plus s={13}/> Add
          </button>
        </div>
        <div className="watchlist-grid">
          {openTrades.map(sym => (
            <div key={sym} className="watchlist-chip" style={{background:'var(--open-trades-bg,#dcfce7)',color:'var(--open-trades-text,#16a34a)',borderColor:'var(--open-trades-border,#86efac)'}}>
              {sym}
              <button className="watchlist-chip-del" onClick={() => toggleOpenTrade(sym)} style={{color:'var(--open-trades-text,#16a34a)'}}>x</button>
            </div>
          ))}
          {openTrades.length === 0 && <span style={{color:'hsl(var(--muted-foreground))',fontSize:'0.82rem'}}>No open trades</span>}
        </div>
      </div>
      <div className="form-card">
        <div style={{fontWeight:600,fontSize:'0.85rem',marginBottom:12,color:'hsl(var(--muted-foreground))'}}>FAVORITE SYMBOLS</div>
        <div style={{display:'flex',gap:8,marginBottom:12}}>
          <input className="form-input" style={{maxWidth:240}} placeholder="Add symbol (e.g. BTC, AAPL)..."
            value={newSym} onChange={e => setNewSym(e.target.value.toUpperCase())}
            onKeyDown={e => e.key === 'Enter' && handleAdd()} />
          <button className="btn btn-primary" onClick={handleAdd} style={{display:'flex',gap:5,alignItems:'center'}}>
            <I.Plus s={13}/> Add
          </button>
        </div>
        <div className="watchlist-grid">
          {watchlist.map(sym => (
            <div key={sym} className="watchlist-chip">
              {sym}
              <button className="watchlist-chip-del" onClick={() => removeFromWatchlist(sym)}>x</button>
            </div>
          ))}
          {watchlist.length === 0 && <span style={{color:'hsl(var(--muted-foreground))',fontSize:'0.82rem'}}>No symbols in watchlist yet</span>}
        </div>
      </div>
    </div>
  );
}

// ============================================================
// RULES
// ============================================================
function Rules() {
  const { rules, addRule, deleteRule } = useTrading();
  const [form, setForm] = useState({ name: '', match_field: 'direction', match_contains: '', column_name: 'bullish', priority: '' });
  const [showForm, setShowForm] = useState(false);

  function handleAdd() {
    if (!form.name.trim() || !form.match_contains.trim()) return;
    addRule({ ...form, priority: form.priority ? parseInt(form.priority) : rules.length + 1 });
    setForm({ name: '', match_field: 'direction', match_contains: '', column_name: 'bullish', priority: '' });
    setShowForm(false);
  }

  const grouped = { bullish: [], bearish: [], sell_calls: [] };
  for (const r of [...rules].sort((a,b) => (a.priority||999) - (b.priority||999))) {
    if (grouped[r.column_name]) grouped[r.column_name].push(r);
  }

  const colInfo = [
    { id: 'bullish', label: 'Bullish', cls: 'bullish' },
    { id: 'bearish', label: 'Bearish', cls: 'bearish' },
    { id: 'sell_calls', label: 'Sell Calls', cls: 'sell' },
  ];

  return (
    <div className="page">
      <div className="page-header" style={{justifyContent:'space-between'}}>
        <span className="page-title">Rules</span>
        <button className="btn btn-primary" onClick={() => setShowForm(!showForm)} style={{display:'flex',gap:5,alignItems:'center'}}>
          <I.Plus s={13}/> Add Rule
        </button>
      </div>
      {showForm && (
        <div className="form-card" style={{marginBottom:16}}>
          <div style={{fontWeight:700,fontSize:'0.88rem',marginBottom:12}}>New Routing Rule</div>
          <div className="form-row">
            <div className="form-field"><label>Rule Name</label>
              <input className="form-input" placeholder="e.g. Bearish short" value={form.name} onChange={e => setForm(f => ({...f, name: e.target.value}))} />
            </div>
            <div className="form-field"><label>Match Field</label>
              <select className="form-input" value={form.match_field} onChange={e => setForm(f => ({...f, match_field: e.target.value}))}>
                <option value="direction">Direction</option>
                <option value="strategy">Strategy</option>
              </select>
            </div>
            <div className="form-field"><label>Contains</label>
              <input className="form-input" placeholder="e.g. short, buy the dip..." value={form.match_contains} onChange={e => setForm(f => ({...f, match_contains: e.target.value}))} />
            </div>
            <div className="form-field"><label>Route To</label>
              <select className="form-input" value={form.column_name} onChange={e => setForm(f => ({...f, column_name: e.target.value}))}>
                <option value="bullish">Bullish</option>
                <option value="bearish">Bearish</option>
                <option value="sell_calls">Sell Calls</option>
              </select>
            </div>
            <div className="form-field" style={{maxWidth:80}}><label>Priority</label>
              <input className="form-input" type="number" placeholder="1" value={form.priority} onChange={e => setForm(f => ({...f, priority: e.target.value}))} />
            </div>
          </div>
          <div style={{display:'flex',gap:8,marginTop:12}}>
            <button className="btn btn-primary" onClick={handleAdd}>Save Rule</button>
            <button className="btn" onClick={() => setShowForm(false)}>Cancel</button>
          </div>
        </div>
      )}
      <div style={{display:'flex',gap:14}}>
        {colInfo.map(({ id, label, cls }) => (
          <div key={id} className="rule-col">
            <div className={'kanban-header ' + cls} style={{borderRadius:6,marginBottom:8}}>
              <span>{label}</span><span>{grouped[id].length}</span>
            </div>
            {grouped[id].map(rule => (
              <div key={rule.id} className="rule-card">
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:8}}>
                  <div>
                    <div className="rule-card-name">{rule.name}</div>
                    <div className="rule-card-desc">When <strong>{rule.match_field}</strong> contains <em>"{rule.match_contains}"</em></div>
                    <div className="rule-card-desc" style={{marginTop:2}}>Priority: {rule.priority}</div>
                  </div>
                  <button className="icon-btn danger" onClick={() => deleteRule(rule.id)}><I.Trash s={13}/></button>
                </div>
              </div>
            ))}
            {grouped[id].length === 0 && (
              <div style={{background:'hsl(var(--card))',border:'1px solid hsl(var(--border))',borderRadius:6,padding:16,textAlign:'center',color:'hsl(var(--muted-foreground))',fontSize:'0.78rem'}}>No rules</div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

// ============================================================
// SETTINGS
// ============================================================
const COLOR_GRID = ['#1ab0c9','#33b3b3','#3b6fd4','#5b4fd4','#9966cc','#cc4488','#cc4444','#e05c4d','#e08022','#e6a619','#d4c033','#88b33a'];

function SettingsPage({ darkMode, setDarkMode }) {
  const [uiFontSize, setUiFontSize] = useState(16);
  const [autoRefresh, setAutoRefresh] = useState(true);
  const [showRefreshMs] = useState(POLL_INTERVAL);

  function applyFontSize(size) {
    setUiFontSize(size);
    document.documentElement.style.setProperty('--ui-font-size', size + 'px');
  }

  return (
    <div className="page">
      <div className="page-header"><span className="page-title">Site Settings</span></div>

      <div className="settings-section">
        <h3>Appearance</h3>
        <div className="settings-row">
          <div><div className="settings-label">Dark Mode</div><div className="settings-desc">Toggle between light and dark theme</div></div>
          <label className="toggle">
            <input type="checkbox" checked={darkMode} onChange={e => { setDarkMode(e.target.checked); document.documentElement.classList.toggle('dark', e.target.checked); }} />
            <span className="toggle-slider"/>
          </label>
        </div>
        <div className="settings-row">
          <div><div className="settings-label">UI Font Size</div><div className="settings-desc">Base font size for the entire app</div></div>
          <div style={{display:'flex',gap:6}}>
            {[14,15,16,17,18].map(s => (
              <button key={s} className={'btn' + (uiFontSize === s ? ' btn-primary' : '')} style={{padding:'3px 8px',fontSize:'0.75rem'}} onClick={() => applyFontSize(s)}>{s}px</button>
            ))}
          </div>
        </div>
      </div>

      <div className="settings-section">
        <h3>Data & Refresh</h3>
        <div className="settings-row">
          <div><div className="settings-label">Live Polling</div><div className="settings-desc">Fetches /api/bootstrap every {showRefreshMs/1000}s, screener every {SCREENER_POLL_INTERVAL/1000}s</div></div>
          <span className="badge badge-green">Active</span>
        </div>
        <div className="settings-row">
          <div><div className="settings-label">API Backend</div><div className="settings-desc">The server providing alerts and screener data</div></div>
          <span style={{fontSize:'0.78rem',color:'hsl(var(--muted-foreground))',fontFamily:'monospace'}}>{API_BASE || window.location.origin}</span>
        </div>
      </div>

      <div className="settings-section">
        <h3>About</h3>
        <div className="settings-row">
          <div className="settings-label">Version</div>
          <span style={{fontSize:'0.82rem',color:'hsl(var(--muted-foreground))'}}>2.0.0</span>
        </div>
        <div className="settings-row">
          <div className="settings-label">Source</div>
          <a href="https://github.com/purabmehta/AlertCMD_Claude" target="_blank" style={{fontSize:'0.82rem',color:'hsl(var(--primary))'}}>GitHub Repo</a>
        </div>
      </div>
    </div>
  );
}

// ============================================================
// MAIN APP
// ============================================================
function App() {
  const [page, setPage] = useState('direction');
  const [darkMode, setDarkMode] = useState(false);

  return (
    <TradingProvider>
      <div className="app">
        <Sidebar page={page} setPage={setPage} />
        <div className="main">
          <TopToolbar page={page} darkMode={darkMode} setDarkMode={setDarkMode} />
          {page === 'direction' && <DirectionBoard/>}
          {page === 'strategy' && <StrategyBoard/>}
          {page === 'feed' && <LiveFeed/>}
          {page === 'screener' && <CryptoScreener/>}
          {page === 'watchlists' && <Watchlists/>}
          {page === 'rules' && <Rules/>}
          {page === 'settings' && <SettingsPage darkMode={darkMode} setDarkMode={setDarkMode}/>}
        </div>
      </div>
    </TradingProvider>
  );
}
