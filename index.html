// ============================================================
// HELPERS
// ============================================================
function classifyAlert(alert, rules) {
  for (const rule of [...rules].sort((a,b) => a.priority - b.priority)) {
    const field = alert[rule.match_field] || '';
    if (field.toLowerCase().includes(rule.match_contains.toLowerCase())) {
      return rule.column_name;
    }
  }
  if (alert.direction === 'long' || alert.direction === 'bullish') return 'bullish';
  return 'bullish';
}

function isToday(dateStr) {
  const d = new Date(dateStr);
  const now = new Date();
  return d.getDate() === now.getDate() && d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
}

function fmtTime(dateStr) {
  const d = new Date(dateStr);
  return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

function fmtDate(dateStr) {
  const d = new Date(dateStr);
  return d.toLocaleDateString([], {month:'short', day:'numeric'}) + ' ' + fmtTime(dateStr);
}

function fmtVol(n) {
  if (n >= 1e9) return (n/1e9).toFixed(1) + 'B';
  if (n >= 1e6) return (n/1e6).toFixed(0) + 'M';
  return n.toLocaleString();
}

function applyScreenerFilter(data, tab) {
  switch(tab) {
    case 'bullish_entry': return data.filter(r => r.weeklyRegime === 'BULLISH' && r.trigger12h === 'BULLISH_CROSS');
    case 'bearish_entry': return data.filter(r => r.weeklyRegime === 'BEARISH' && r.trigger12h === 'BEARISH_CROSS');
    case 'already_bullish': return data.filter(r => r.weeklyRegime === 'BULLISH' && (r.trigger12h === 'BULLISH' || r.trigger12h === 'BULLISH_CROSS'));
    case 'already_bearish': return data.filter(r => r.weeklyRegime === 'BEARISH' && (r.trigger12h === 'BEARISH' || r.trigger12h === 'BEARISH_CROSS'));
    case 'exit_long': return data.filter(r => r.stochRsi12hCross === 'cross_down' && (r.trigger12h === 'BULLISH' || r.trigger12h === 'BULLISH_CROSS'));
    case 'exit_short': return data.filter(r => r.stochRsi12hCross === 'cross_up' && (r.trigger12h === 'BEARISH' || r.trigger12h === 'BEARISH_CROSS'));
    case 'long_aggressive': return data.filter(r => (r.trigger12h === 'BULLISH' || r.trigger12h === 'BULLISH_CROSS') && r.stochRsi12hCross === 'none');
    case 'short_aggressive': return data.filter(r => r.trigger12h === 'BEARISH' && r.stochRsi12hCross === 'cross_down');
    default: return data;
  }
}

function LiveFeed({ alerts, rules, openTrades, setOpenTrades, favorites, setFavorites, setAlerts, assetFilter, searchQuery }) {
  const [activeFilter, setActiveFilter] = useState(null);

  const filtered = useMemo(() => {
    let list = [...alerts];
    if (assetFilter !== 'all') list = list.filter(a => a.asset_class === (assetFilter === 'stocks' ? 'stock' : 'crypto'));
    if (searchQuery) list = list.filter(a => a.symbol.toLowerCase().includes(searchQuery.toLowerCase()) || (a.message_raw||'').toLowerCase().includes(searchQuery.toLowerCase()));
    if (activeFilter === 'today') list = list.filter(a => isToday(a.created_at));
    if (activeFilter === 'open') list = list.filter(a => openTrades.includes(a.symbol));
    if (activeFilter === 'favorites') list = list.filter(a => favorites.includes(a.id));
    return list;
  }, [alerts, assetFilter, searchQuery, activeFilter, openTrades, favorites]);

  function getColBadge(alert) {
    const col = classifyAlert(alert, rules);
    if (col === 'bullish') return <span className="badge badge-bullish">Bullish</span>;
    if (col === 'bearish') return <span className="badge badge-bearish">Bearish</span>;
    if (col === 'sell_calls') return <span className="badge badge-sellcalls">Sell Calls</span>;
    return <span className="badge badge-gray">{col}</span>;
  }

  return (
    <div className="page">
      <div className="page-header">
        <span className="page-title">Live Feed</span>
        <span className="count-text">{filtered.length} of {alerts.length} alerts</span>
      </div>
      <div className="filter-bar">
        <button className={`filter-btn ${activeFilter === 'today' ? 'active' : ''}`} onClick={() => setActiveFilter(activeFilter === 'today' ? null : 'today')}>Today</button>
        <button className={`filter-btn ${activeFilter === 'open' ? 'active' : ''}`} onClick={() => setActiveFilter(activeFilter === 'open' ? null : 'open')}>Open Trades</button>
        <button className={`filter-btn ${activeFilter === 'favorites' ? 'active' : ''}`} onClick={() => setActiveFilter(activeFilter === 'favorites' ? null : 'favorites')}>Favorites</button>
        <button className="filter-btn" onClick={() => setActiveFilter(null)}>Clear</button>
      </div>
      <div className="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Timestamp</th>
              <th>Symbol</th>
              <th>#Price</th>
              <th>Action</th>
              <th>Interval</th>
              <th>Message</th>
              <th>Trade</th>
              <th>Fav</th>
              <th>Del</th>
            </tr>
          </thead>
          <tbody>
            {filtered.map(alert => (
              <tr key={alert.id}>
                <td className="mono" style={{fontSize:'0.75rem',whiteSpace:'nowrap'}}>
                  {fmtDate(alert.created_at)}
                  {isToday(alert.created_at) && <span className="today-badge">TODAY</span>}
                </td>
                <td><span className="mono" style={{fontWeight:700}}>{alert.symbol}</span></td>
                <td className="mono">{alert.price ? (alert.price < 10 ? alert.price.toFixed(4) : alert.price.toFixed(2)) : '-'}</td>
                <td>{alert.direction || '-'}</td>
                <td>{alert.timeframe || '-'}</td>
                <td style={{maxWidth:280}}>
                  {getColBadge(alert)}
                  <span style={{marginLeft:6,fontSize:'0.78rem',color:'var(--text2)'}}>{alert.message_raw}</span>
                </td>
                <td>
                  <button
                    className={`open-trade-btn ${openTrades.includes(alert.symbol) ? 'active' : ''}`}
                    onClick={() => setOpenTrades(prev => prev.includes(alert.symbol) ? prev.filter(s => s !== alert.symbol) : [...prev, alert.symbol])}
                  >
                    {openTrades.includes(alert.symbol) ? 'OPEN' : 'Trade'}
                  </button>
                </td>
                <td>
                  <button
                    className={`icon-btn ${favorites.includes(alert.id) ? 'active' : ''}`}
                    onClick={() => setFavorites(prev => prev.includes(alert.id) ? prev.filter(x => x !== alert.id) : [...prev, alert.id])}
                  >
                    <Icon.Star filled={favorites.includes(alert.id)} />
                  </button>
                </td>
                <td>
                  <button
                    className="icon-btn danger"
                    onClick={() => setAlerts(prev => prev.filter(a => a.id !== alert.id))}
                  >
                    <Icon.Trash />
                  </button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function DirectionBoard({ alerts, rules, openTrades, favorites, setFavorites, setAlerts, assetFilter, searchQuery, watchlist }) {
  const [filters, setFilters] = useState({ today: false, openOnly: false, dedupe: false });
  const [watchlistFilter, setWatchlistFilter] = useState(null);

  function toggleFilter(key) {
    setFilters(prev => ({ ...prev, [key]: !prev[key] }));
  }

  const processedAlerts = useMemo(() => {
    let list = [...alerts];
    if (assetFilter !== 'all') list = list.filter(a => a.asset_class === (assetFilter === 'stocks' ? 'stock' : 'crypto'));
    if (searchQuery) list = list.filter(a => a.symbol.toLowerCase().includes(searchQuery.toLowerCase()));
    if (filters.today) list = list.filter(a => isToday(a.created_at));
    if (filters.openOnly) list = list.filter(a => openTrades.includes(a.symbol));
    if (watchlistFilter) list = list.filter(a => a.symbol === watchlistFilter);
    return list;
  }, [alerts, assetFilter, searchQuery, filters, openTrades, watchlistFilter]);

  const columns = useMemo(() => {
    const cols = { bullish: [], bearish: [], sell_calls: [], open_trades: [] };
    let symbolMap = {};
    for (const alert of processedAlerts) {
      const col = classifyAlert(alert, rules);
      if (!cols[col]) cols[col] = [];
      if (filters.dedupe) {
        if (!symbolMap[col + alert.symbol]) {
          symbolMap[col + alert.symbol] = 1;
          cols[col].push(alert);
        } else {
          symbolMap[col + alert.symbol]++;
          const existing = cols[col].find(a => a.symbol === alert.symbol);
          if (existing) existing._count = symbolMap[col + alert.symbol];
        }
      } else {
        cols[col].push(alert);
      }
    }
    for (const sym of INITIAL_OPEN_TRADES) {
      if (!filters.openOnly || openTrades.includes(sym)) {
        const lastAlert = alerts.find(a => a.symbol === sym);
        cols.open_trades.push({ id: 'ot_' + sym, symbol: sym, created_at: lastAlert?.created_at || new Date().toISOString(), _openTrade: true });
      }
    }
    return cols;
  }, [processedAlerts, filters, openTrades, alerts, rules]);

  function SymCard({ alert, col }) {
    const isFav = favorites.includes(alert.id);
    return (
      <div className="symbol-card">
        <div>
          <div style={{display:'flex',alignItems:'center',gap:5}}>
            <span className="symbol-card-name">{alert.symbol}</span>
            {alert._count > 1 && <span className="dup-badge">x{alert._count}</span>}
          </div>
          <div className="symbol-card-time">{fmtTime(alert.created_at)}</div>
        </div>
        <div className="symbol-card-actions">
          {!alert._openTrade && (
            <>
              <button className={`icon-btn ${isFav ? 'active' : ''}`} onClick={() => setFavorites(prev => prev.includes(alert.id) ? prev.filter(x => x !== alert.id) : [...prev, alert.id])}>
                <Icon.Star filled={isFav} size={12} />
              </button>
              <button className="icon-btn" onClick={() => window.open(`https://www.tradingview.com/chart/?symbol=${alert.symbol}`, '_blank')}>
                <Icon.ExternalLink size={12} />
              </button>
              <button className="icon-btn danger" onClick={() => setAlerts(prev => prev.filter(a => a.id !== alert.id))}>
                <Icon.Trash size={12} />
              </button>
            </>
          )}
          {alert._openTrade && (
            <button className="icon-btn" onClick={() => window.open(`https://www.tradingview.com/chart/?symbol=${alert.symbol}`, '_blank')}>
              <Icon.ExternalLink size={12} />
            </button>
          )}
        </div>
      </div>
    );
  }

  const colDefs = [
    { key: 'bullish', label: 'Bullish', cls: 'bullish' },
    { key: 'bearish', label: 'Bearish', cls: 'bearish' },
    { key: 'sell_calls', label: 'Sell Calls', cls: 'sellcalls' },
    { key: 'open_trades', label: 'Open Trades', cls: 'opentrades' },
  ];

  const watchlistSymbols = watchlist.slice(0, 20);

  return (
    <div className="page">
      <div className="info-banner">
        <Icon.AlertCircle size={15} />
        Alerts are automatically routed to columns based on your rules. Click a symbol to view on TradingView.
      </div>
      <div className="page-header">
        <span className="page-title">Direction Board</span>
      </div>
      <div className="filter-bar">
        <button className={`filter-btn ${filters.today ? 'active' : ''}`} onClick={() => toggleFilter('today')}>Today</button>
        <button className={`filter-btn ${filters.openOnly ? 'active' : ''}`} onClick={() => toggleFilter('openOnly')}>Open Trades Only</button>
        <button className={`filter-btn ${filters.dedupe ? 'active' : ''}`} onClick={() => toggleFilter('dedupe')}>Dedupe</button>
        {watchlistSymbols.map(s => (
          <button key={s} className={`filter-btn ${watchlistFilter === s ? 'active' : ''}`} onClick={() => setWatchlistFilter(watchlistFilter === s ? null : s)} style={{fontSize:'0.7rem',padding:'3px 8px'}}>
            {s}
          </button>
        ))}
      </div>
      <div className="kanban">
        {colDefs.map(({ key, label, cls }) => (
          <div key={key} className="kanban-col">
            <div className={`kanban-header ${cls}`}>
              <span>{label}</span>
              <span>{columns[key]?.length || 0}</span>
            </div>
            <div className="kanban-body">
              {(columns[key] || []).map(alert => (
                <SymCard key={alert.id} alert={alert} col={key} />
              ))}
              {(!columns[key] || columns[key].length === 0) && (
                <div style={{color:'var(--text2)',fontSize:'0.78rem',textAlign:'center',padding:'20px 0'}}>No alerts</div>
              )}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ============================================================
// STRATEGY BOARD PAGE
// ============================================================
function StrategyBoard({ alerts, assetFilter, searchQuery }) {
  const strategies = useMemo(() => {
    let list = [...alerts];
    if (assetFilter !== 'all') list = list.filter(a => a.asset_class === (assetFilter === 'stocks' ? 'stock' : 'crypto'));
    if (searchQuery) list = list.filter(a => a.symbol.toLowerCase().includes(searchQuery.toLowerCase()));
    const map = {};
    for (const alert of list) {
      const strat = alert.strategy || 'Uncategorized';
      if (!map[strat]) map[strat] = [];
      map[strat].push(alert);
    }
    return map;
  }, [alerts, assetFilter, searchQuery]);

  const stratKeys = Object.keys(strategies).sort();

  return (
    <div className="page">
      <div className="page-header">
        <span className="page-title">Strategy Board</span>
        <span className="count-text">{stratKeys.length} strategies</span>
      </div>
      <div className="kanban">
        {stratKeys.map(strat => (
          <div key={strat} className="kanban-col">
            <div className="kanban-header" style={{background:'var(--bg2)',color:'var(--text)',borderRadius:'6px 6px 0 0'}}>
              <span style={{fontWeight:600,fontSize:'0.78rem'}}>{strat}</span>
              <span style={{fontSize:'0.78rem'}}>{strategies[strat].length}</span>
            </div>
            <div className="kanban-body">
              {strategies[strat].map(alert => (
                <div key={alert.id} className="symbol-card" style={{cursor:'pointer'}} onClick={() => window.open(`https://www.tradingview.com/chart/?symbol=${alert.symbol}`, '_blank')}>
                  <div>
                    <div className="symbol-card-name">{alert.symbol}</div>
                    <div className="symbol-card-time">{fmtDate(alert.created_at)}</div>
                  </div>
                  <Icon.ExternalLink size={11} />
                </div>
              ))}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ============================================================
// CRYPTO SCREENER PAGE
// ============================================================
const SCREENER_TABS = [
  { id: 'bullish_entry', label: 'Bullish Trade Entry' },
  { id: 'bearish_entry', label: 'Bearish Trade Entry' },
  { id: 'already_bullish', label: 'Already Bullish' },
  { id: 'already_bearish', label: 'Already Bearish' },
  { id: 'exit_long', label: 'Exit Long' },
  { id: 'exit_short', label: 'Exit Short' },
  { id: 'long_aggressive', label: 'Long Aggressive' },
  { id: 'short_aggressive', label: 'Short Aggressive' },
  { id: 'all', label: 'All / Debug' },
];

function Screener({ watchlist }) {
  const [activeTab, setActiveTab] = useState('bullish_entry');
  const [screenerData, setScreenerData] = useState(SCREENER_DATA);
  const [loading, setLoading] = useState(false);
  const [favSymbols, setFavSymbols] = useState(watchlist);

  async function refresh() {
    setLoading(true);
    try {
      const r = await fetch(API_BASE + '/api/screener/live?smaTf=1w&smaLength=5&triggerTf=12h&macdFast=12&macdSlow=26&macdSignal=9&minQuoteVol=100000000');
      if (r.ok) {
        const data = await r.json();
        setScreenerData(data);
      }
    } catch(e) {}
    setLoading(false);
  }

  const filtered = useMemo(() => applyScreenerFilter(screenerData, activeTab), [screenerData, activeTab]);

  function RegimeBadge({ val }) {
    return val === 'BULLISH'
      ? <span className="regime-bull">▲ BULL</span>
      : <span className="regime-bear">▼ BEAR</span>;
  }

  function TriggerBadge({ val }) {
    const isCross = val?.includes('CROSS');
    const isBull = val?.includes('BULLISH');
    return (
      <span className={isBull ? 'macd-bull' : 'macd-bear'} style={{fontWeight: isCross ? 700 : 400}}>
        {val || '-'}{isCross ? ' ⚡' : ''}
      </span>
    );
  }

  return (
    <div className="page">
      <div className="page-header" style={{justifyContent:'space-between'}}>
        <span className="page-title">Crypto Screener</span>
        <button className="btn btn-primary" onClick={refresh} disabled={loading}>
          {loading ? 'Refreshing...' : '↻ Refresh'}
        </button>
      </div>
      <div className="screener-tabs">
        {SCREENER_TABS.map(t => (
          <button key={t.id} className={`screener-tab ${activeTab === t.id ? 'active' : ''}`} onClick={() => setActiveTab(t.id)}>
            {t.label} {activeTab === t.id && <span style={{marginLeft:4,opacity:0.7}}>({filtered.length})</span>}
          </button>
        ))}
      </div>
      <div className="table-wrap">
        <table>
          <thead>
            <tr>
              <th>★</th>
              <th>Symbol</th>
              <th>Last</th>
              <th>24h%</th>
              <th>24h Vol</th>
              <th>Weekly Regime</th>
              <th>12H Trigger</th>
              <th>StochRSI</th>
              <th>Updated</th>
            </tr>
          </thead>
          <tbody>
            {filtered.map(row => (
              <tr key={row.symbol} style={{cursor:'pointer'}} onClick={() => window.open(`https://www.tradingview.com/chart/?symbol=${row.symbol}USDT`, '_blank')}>
                <td>
                  <button className={`icon-btn ${favSymbols.includes(row.symbol) ? 'active' : ''}`} onClick={e => { e.stopPropagation(); setFavSymbols(prev => prev.includes(row.symbol) ? prev.filter(s => s !== row.symbol) : [...prev, row.symbol]); }}>
                    <Icon.Star filled={favSymbols.includes(row.symbol)} size={13} />
                  </button>
                </td>
                <td><span className="mono" style={{fontWeight:700}}>{row.symbol}</span></td>
                <td className="mono">{row.price ? (row.price < 10 ? row.price.toFixed(4) : row.price.toFixed(2)) : '-'}</td>
                <td className={`mono ${row.change24hPct >= 0 ? 'text-green' : 'text-red'}`}>
                  {row.change24hPct >= 0 ? '+' : ''}{row.change24hPct?.toFixed(2)}%
                </td>
                <td className="mono">{fmtVol(row.quoteVolume24h)}</td>
                <td><RegimeBadge val={row.weeklyRegime} /></td>
                <td><TriggerBadge val={row.trigger12h} /></td>
                <td style={{fontSize:'0.75rem'}}>
                  {row.stochRsi12hCross === 'cross_up' ? <span className="text-green">↑ Cross Up</span>
                   : row.stochRsi12hCross === 'cross_down' ? <span className="text-red">↓ Cross Down</span>
                   : <span style={{color:'var(--text2)'}}>—</span>}
                </td>
                <td style={{fontSize:'0.72rem',color:'var(--text2)'}}>{fmtTime(row.updatedAt)}</td>
              </tr>
            ))}
            {filtered.length === 0 && (
              <tr><td colSpan="9" style={{textAlign:'center',padding:'24px',color:'var(--text2)'}}>No results for this filter</td></tr>
            )}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ============================================================
// WATCHLISTS PAGE
// ============================================================
function Watchlists({ watchlist, setWatchlist }) {
  const [newSym, setNewSym] = useState('');

  function addSymbol() {
    const sym = newSym.trim().toUpperCase();
    if (sym && !watchlist.includes(sym)) {
      setWatchlist(prev => [...prev, sym].sort());
      setNewSym('');
    }
  }

  return (
    <div className="page">
      <div className="page-header">
        <span className="page-title">Watchlists</span>
        <span className="count-text">{watchlist.length} symbols</span>
      </div>
      <div className="add-symbol-form">
        <input
          placeholder="Add symbol (e.g. BTC, AAPL)..."
          value={newSym}
          onChange={e => setNewSym(e.target.value.toUpperCase())}
          onKeyDown={e => e.key === 'Enter' && addSymbol()}
        />
        <button className="btn btn-primary" onClick={addSymbol}>
          <Icon.Plus size={13} /> Add
        </button>
      </div>
      <div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:8,padding:16}}>
        <div style={{fontWeight:600,fontSize:'0.85rem',marginBottom:12}}>Favorite Symbols</div>
        <div className="watchlist-grid">
          {watchlist.map(sym => (
            <div key={sym} className="watchlist-chip">
              {sym}
              <button onClick={() => setWatchlist(prev => prev.filter(s => s !== sym))} title="Remove">×</button>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ============================================================
// RULES PAGE
// ============================================================
function Rules({ rules, setRules }) {
  const [form, setForm] = useState({ name: '', match_field: 'direction', match_contains: '', column_name: 'bullish' });
  const [showForm, setShowForm] = useState(false);

  function addRule() {
    if (!form.name || !form.match_contains) return;
    const newRule = { ...form, id: Date.now(), priority: rules.length + 1 };
    setRules(prev => [...prev, newRule]);
    setForm({ name: '', match_field: 'direction', match_contains: '', column_name: 'bullish' });
    setShowForm(false);
  }

  const cols = { bullish: [], bearish: [], sell_calls: [] };
  for (const rule of rules) {
    if (cols[rule.column_name]) cols[rule.column_name].push(rule);
  }

  const colDefs = [
    { key: 'bullish', label: 'Bullish', cls: 'bullish' },
    { key: 'bearish', label: 'Bearish', cls: 'bearish' },
    { key: 'sell_calls', label: 'Sell Calls', cls: 'sellcalls' },
  ];

  return (
    <div className="page">
      <div className="page-header" style={{justifyContent:'space-between'}}>
        <span className="page-title">Rules</span>
        <button className="btn btn-primary" onClick={() => setShowForm(!showForm)}>
          <Icon.Plus size={13} /> Add Rule
        </button>
      </div>
      {showForm && (
        <div className="rule-form">
          <h3>New Routing Rule</h3>
          <div className="form-row">
            <div className="form-field">
              <label>Rule Name</label>
              <input placeholder="e.g. Bearish short" value={form.name} onChange={e => setForm(f => ({...f, name: e.target.value}))} />
            </div>
            <div className="form-field">
              <label>Match Field</label>
              <select value={form.match_field} onChange={e => setForm(f => ({...f, match_field: e.target.value}))}>
                <option value="direction">Direction</option>
                <option value="strategy">Strategy</option>
              </select>
            </div>
            <div className="form-field">
              <label>Contains</label>
              <input placeholder="e.g. short, buy the dip..." value={form.match_contains} onChange={e => setForm(f => ({...f, match_contains: e.target.value}))} />
            </div>
            <div className="form-field">
              <label>Route To</label>
              <select value={form.column_name} onChange={e => setForm(f => ({...f, column_name: e.target.value}))}>
                <option value="bullish">Bullish</option>
                <option value="bearish">Bearish</option>
                <option value="sell_calls">Sell Calls</option>
              </select>
            </div>
            <button className="btn btn-primary" onClick={addRule}>Save Rule</button>
            <button className="btn" onClick={() => setShowForm(false)}>Cancel</button>
          </div>
        </div>
      )}
      <div style={{display:'flex',gap:16}}>
        {colDefs.map(({ key, label, cls }) => (
          <div key={key} style={{flex:1}}>
            <div className={`kanban-header ${cls}`} style={{borderRadius:6,marginBottom:8}}>
              <span>{label}</span>
              <span>{cols[key].length}</span>
            </div>
            {cols[key].map(rule => (
              <div key={rule.id} className="rule-card">
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                  <div>
                    <div style={{fontWeight:600,fontSize:'0.85rem'}}>{rule.name}</div>
                    <div style={{fontSize:'0.75rem',color:'var(--text2)',marginTop:3}}>
                      When <strong>{rule.match_field}</strong> contains "<strong>{rule.match_contains}</strong>"
                    </div>
                    <div style={{fontSize:'0.72rem',color:'var(--text2)',marginTop:2}}>Priority: {rule.priority}</div>
                  </div>
                  <button className="icon-btn danger" onClick={() => setRules(prev => prev.filter(r => r.id !== rule.id))}>
                    <Icon.Trash size={13} />
                  </button>
                </div>
              </div>
            ))}
            {cols[key].length === 0 && (
              <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:6,padding:16,textAlign:'center',color:'var(--text2)',fontSize:'0.78rem'}}>
                No rules
              </div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

// ============================================================
// SETTINGS PAGE
// ============================================================
function Settings({ darkMode, setDarkMode }) {
  const [headerStyle, setHeaderStyle] = useState('dark-green');
  const [sidebarFont, setSidebarFont] = useState('inter');
  const [compactMode, setCompactMode] = useState(false);
  const [autoRefresh, setAutoRefresh] = useState(true);
  const [refreshInterval, setRefreshInterval] = useState(30);

  return (
    <div className="page">
      <div className="page-header">
        <span className="page-title">Site Settings</span>
      </div>
      <div className="settings-section">
        <h3>Appearance</h3>
        <div className="settings-row">
          <div>
            <div className="settings-label">Dark Mode</div>
            <div className="settings-desc">Toggle between light and dark theme</div>
          </div>
          <label className="toggle">
            <input type="checkbox" checked={darkMode} onChange={e => {
              setDarkMode(e.target.checked);
              document.documentElement.classList.toggle('dark', e.target.checked);
            }} />
            <span className="toggle-slider"/>
          </label>
        </div>
        <div className="settings-row">
          <div>
            <div className="settings-label">Column Header Style</div>
            <div className="settings-desc">Style for Bullish/Bearish/Sell Calls headers</div>
          </div>
          <select value={headerStyle} onChange={e => setHeaderStyle(e.target.value)}>
            <option value="dark-green">Dark Green</option>
            <option value="colored">Colored</option>
            <option value="minimal">Minimal</option>
          </select>
        </div>
        <div className="settings-row">
          <div>
            <div className="settings-label">Sidebar Font</div>
            <div className="settings-desc">Font family for sidebar navigation</div>
          </div>
          <select value={sidebarFont} onChange={e => setSidebarFont(e.target.value)}>
            <option value="inter">Inter</option>
            <option value="jetbrains">JetBrains Mono</option>
            <option value="system">System Default</option>
          </select>
        </div>
        <div className="settings-row">
          <div>
            <div className="settings-label">Compact Mode</div>
            <div className="settings-desc">Reduce padding and card sizes</div>
          </div>
          <label className="toggle">
            <input type="checkbox" checked={compactMode} onChange={e => setCompactMode(e.target.checked)} />
            <span className="toggle-slider"/>
          </label>
        </div>
      </div>
      <div className="settings-section">
        <h3>Data & Refresh</h3>
        <div className="settings-row">
          <div>
            <div className="settings-label">Auto Refresh</div>
            <div className="settings-desc">Automatically refresh screener data</div>
          </div>
          <label className="toggle">
            <input type="checkbox" checked={autoRefresh} onChange={e => setAutoRefresh(e.target.checked)} />
            <span className="toggle-slider"/>
          </label>
        </div>
        <div className="settings-row">
          <div>
            <div className="settings-label">Refresh Interval</div>
            <div className="settings-desc">How often to refresh live data (seconds)</div>
          </div>
          <select value={refreshInterval} onChange={e => setRefreshInterval(Number(e.target.value))}>
            <option value={15}>15s</option>
            <option value={30}>30s</option>
            <option value={60}>60s</option>
            <option value={120}>2min</option>
          </select>
        </div>
      </div>
      <div className="settings-section">
        <h3>About</h3>
        <div className="settings-row">
          <div>
            <div className="settings-label">Version</div>
          </div>
          <span style={{fontSize:'0.82rem',color:'var(--text2)'}}>1.0.0</span>
        </div>
        <div className="settings-row">
          <div>
            <div className="settings-label">API Backend</div>
          </div>
          <span style={{fontSize:'0.82rem',color:'var(--text2)',fontFamily:'monospace'}}>{API_BASE}</span>
        </div>
      </div>
    </div>
  );
}

// ============================================================
// MAIN APP
// ============================================================
function App() {
  const [currentPage, setCurrentPage] = useState('direction');
  const [alerts, setAlerts] = useState(INITIAL_ALERTS);
  const [watchlist, setWatchlist] = useState(INITIAL_WATCHLIST);
  const [openTrades, setOpenTrades] = useState(INITIAL_OPEN_TRADES);
  const [rules, setRules] = useState(INITIAL_RULES);
  const [favorites, setFavorites] = useState([]);
  const [assetFilter, setAssetFilter] = useState('all');
  const [searchQuery, setSearchQuery] = useState('');
  const [darkMode, setDarkMode] = useState(true);

  // Try to load live data from API
  useEffect(() => {
    fetch(API_BASE + '/api/bootstrap')
      .then(r => r.ok ? r.json() : null)
      .then(data => {
        if (!data) return;
        if (data.alerts?.length) setAlerts(data.alerts);
        if (data.watchlist?.length) setWatchlist(data.watchlist.map(w => w.symbol || w));
        if (data.openTrades?.length) setOpenTrades(data.openTrades.map(t => t.symbol || t));
        if (data.rules?.length) setRules(data.rules);
      })
      .catch(() => {});
  }, []);

  const sharedProps = { alerts, setAlerts, rules, openTrades, setOpenTrades, favorites, setFavorites, assetFilter, searchQuery, watchlist, setWatchlist };

  return (
    <div className="app">
      <Sidebar currentPage={currentPage} setPage={setCurrentPage} />
      <div className="main">
        <TopNav assetFilter={assetFilter} setAssetFilter={setAssetFilter} searchQuery={searchQuery} setSearchQuery={setSearchQuery} darkMode={darkMode} setDarkMode={setDarkMode} />
        {currentPage === 'feed' && <LiveFeed {...sharedProps} />}
        {currentPage === 'direction' && <DirectionBoard {...sharedProps} />}
        {currentPage === 'strategy' && <StrategyBoard alerts={alerts} assetFilter={assetFilter} searchQuery={searchQuery} />}
        {currentPage === 'screener' && <Screener watchlist={watchlist} />}
        {currentPage === 'watchlists' && <Watchlists watchlist={watchlist} setWatchlist={setWatchlist} />}
        {currentPage === 'rules' && <Rules rules={rules} setRules={setRules} />}
        {currentPage === 'settings' && <Settings darkMode={darkMode} setDarkMode={setDarkMode} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
